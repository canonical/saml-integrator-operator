name: Promote charm

on:
  workflow_dispatch:
    inputs:
      track:
        type: choice
        description: 'Track to promote'
        default: latest
        options:
        - latest
        - '1'

jobs:
  promote-charm:
    uses: canonical/operator-workflows/.github/workflows/promote_charm.yaml@main
    with:
      origin-channel: ${{ format('{0}/edge', inputs.track) }}
      destination-channel: ${{ format('{0}/stable', inputs.track) }}
    secrets: inherit
