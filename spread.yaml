project: saml-integrator-operator
path: /home/ubuntu/proj
kill-timeout: 60m
warn-timeout: 1m
backends:
  integration-test-juju3:
    type: integration-test
    systems:
    - ubuntu-24.04
    environment:
      CONCIERGE: concierge-lxd-juju3.yaml
  integration-test-juju4:
    type: integration-test
    systems:
    - ubuntu-24.04
    environment:
      CONCIERGE: concierge-lxd.yaml
environment:
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-v1.0.1}")'
exclude:
- .git
- .tox
- .venv
- .*_cache
integration-suites:
  tests/integration/:
    summary: SAML Integrator integration tests
    working-dir: ./
    backends:
    - integration-test-juju3
    - integration-test-juju4
